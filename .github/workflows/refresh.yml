name: Daily Data Refresh

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          TMDB_API_KEY:         ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY:         ${{ secrets.OMDB_API_KEY }}
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT:    ${{ secrets.REDDIT_USER_AGENT }}
        run: |
          cd scripts
          python3 pipeline.py

      - name: Validate before commit
        run: |
          python3 - << 'PYEOF'
          import pandas as pd, sys
          df = pd.read_csv("data/movies.csv")
          sentiment_count = df["audience_positive"].notna().sum()
          print(f"Sentiment rows: {sentiment_count}")
          if sentiment_count == 0:
              print("❌ Zero sentiment scores — likely quota hit. Aborting commit.")
              sys.exit(1)
          print("✅ Data looks good, proceeding with commit.")
          PYEOF

      - name: Commit updated data
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name  "GitHub Actions"
          git add data/movies.csv
          git diff --staged --quiet || git commit -m "auto: refresh $(date -u +%Y-%m-%d)"
          git push
